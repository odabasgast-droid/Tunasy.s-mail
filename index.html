<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna / Tunasy - Startseite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Anime Blue Energy Balls Background */
        #ball-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .energy-ball {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 195, 255, 0.9) 0%, rgba(0, 110, 255, 0.4) 60%, rgba(0, 50, 200, 0) 100%);
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8);
            animation: floatBall 6s infinite ease-in-out alternate;
        }

        @keyframes floatBall {
            0% {
                transform: translateY(0px) translateX(0px) scale(1);
            }
            50% {
                transform: translateY(-40px) translateX(30px) scale(1.1);
            }
            100% {
                transform: translateY(30px) translateX(-40px) scale(0.95);
            }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Styling */
        .logo-wrapper {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            border: 3.5px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        .logo span {
            color: #ffffff;
            font-size: 46px;
            font-weight: bold;
            line-height: 1;
            margin-top: -2px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Play Button for Animation */
        .play-btn {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
        }

        /* Links List */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: rgba(25, 25, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            font-size: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0;
            transform: translateY(20px);
            animation: slideIn 0.8s ease forwards;
        }

        /* Staggered animation for links */
        .link-card:nth-child(1) { animation-delay: 0.2s; }
        .link-card:nth-child(2) { animation-delay: 0.35s; }
        .link-card:nth-child(3) { animation-delay: 0.5s; }
        .link-card:nth-child(4) { animation-delay: 0.65s; }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-card:hover {
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .link-card img, .link-card svg {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .link-text {
            flex-grow: 1;
            text-align: center;
            margin-right: 39px; /* compensates icon width to keep text centered */
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666666;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="ball-container"></div>

                <span class="link-text">Discord</span>
            </a>
        </div>

        <footer>© 2026 Tuna / Tunasy</footer>
    </div>

    <script>
        let ballsActive = false;

        function toggleEnergyBalls() {
            const container = document.getElementById('ball-container');
            const btn = document.querySelector('.play-btn');

            ballsActive = !ballsActive;

            if (ballsActive) {
                container.style.opacity = '1';
                btn.textContent = '⏸ Anime Modus stoppen';
                btn.style.background = 'linear-gradient(135deg, #ff416c, #ff4b2b)';
                btn.style.boxShadow = '0 4px 15px rgba(255, 65, 108, 0.4)';
                createEnergyBalls();
            } else {
                container.style.opacity = '0';
                btn.textContent = '▶ Anime Modus aktivieren';
                btn.style.background = 'linear-gradient(135deg, #0072ff, #00c6ff)';
                btn.style.boxShadow = '0 4px 15px rgba(0, 114, 255, 0.4)';
                container.innerHTML = '';
            }
        }

        function createEnergyBalls() {
            const container = document.getElementById('ball-container');
            container.innerHTML = '';
            
            // Generate 15 floating blue energy balls with random sizes and positions
            for (let i = 0; i < 15; i++) {
                const ball = document.createElement('div');
                const size = Math.floor(Math.random() * 80) + 30; // 30px to 110px
                
                ball.classList.add('energy-ball');
                ball.style.width = `${size}px`;
                ball.style.height = `${size}px`;
                ball.style.top = `${Math.random() * 100}vh`;
                ball.style.left = `${Math.random() * 100}vw`;
                
                // Randomize animation duration and delay
                const duration = Math.random() * 5 + 4; // 4s to 9s
                const delay = Math.random() * 3;
                ball.style.animationDuration = `${duration}s`;
                ball.style.animationDelay = `${delay}s`;

                container.appendChild(ball);
            }
        }
    </script>
</body>
</html>

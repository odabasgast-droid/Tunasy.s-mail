<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna / Tunasy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Island oben in der Mitte mit Farbverlauf-Leuchten */
        .dynamic-island {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        .dynamic-island.active {
            width: 230px;
            border-color: transparent;
            background: linear-gradient(135deg, #000, #111);
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.6), 0 0 10px rgba(255, 65, 108, 0.6);
            animation: islandGlow 2s infinite alternate;
        }
        @keyframes islandGlow {
            0% { box-shadow: 0 0 15px rgba(0, 198, 255, 0.5), 0 0 5px rgba(255, 65, 108, 0.5); }
            100% { box-shadow: 0 0 30px rgba(0, 198, 255, 0.9), 0 0 15px rgba(0, 255, 136, 0.8); }
        }

        .island-dot {
            width: 8px;
            height: 8px;
            background: #555;
            border-radius: 50%;
            transition: 0.3s;
        }
        .dynamic-island.active .island-dot {
            background: linear-gradient(135deg, #00c6ff, #00ff88);
            box-shadow: 0 0 10px #00ff88;
            animation: pulseDot 0.8s infinite alternate;
        }
        .island-text {
            font-size: 11px;
            color: #888;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dynamic-island.active .island-text {
            color: #fff;
            font-weight: 600;
        }
        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.4); opacity: 1; }
        }

        /* KI-Symbol Button oben rechts */
        .ai-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .ai-toggle-btn:hover {
            border-color: #00c6ff;
            transform: scale(1.05);
        }
        .ai-toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: #00c6ff;
        }

        /* Floating KI Chat Popup (Fenster) */
        .ai-popup-chat {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 320px;
            max-width: calc(100vw - 40px);
            height: 400px;
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            z-index: 99;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ai-popup-chat.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
        .ai-popup-header {
            font-size: 14px;
            font-weight: 600;
            color: #00c6ff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 8px;
        }
        .ai-close-x {
            cursor: pointer;
            color: #888;
            font-size: 16px;
        }
        .ai-close-x:hover { color: #fff; }

        #ai-chat-output {
            flex: 1;
            overflow-y: auto;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 10px;
            color: #d1d1d6;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .ai-input-group {
            display: flex;
            gap: 6px;
        }
        .ai-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1a1a20;
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .ai-input:focus { border-color: #00c6ff; }
        .ai-send-btn {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Restliches Design */
        #anime-bg, #ball-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none !important; z-index: 1; opacity: 0; transition: opacity 1s ease;
        }
        .container {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; z-index: 10; margin-top: 30px;
        }
        .logo-wrapper { margin-bottom: 12px; }
        .logo {
            width: 85px; height: 85px; border: 3px solid #ffffff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; background-color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .logo span { color: #ffffff; font-size: 42px; font-weight: bold; line-height: 1; margin-top: -2px; }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; z-index: 15; flex-wrap: wrap; justify-content: center; }
        .play-btn {
            background: linear-gradient(135deg, #0072ff, #00c6ff); color: white; border: none; padding: 10px 18px;
            font-size: 13px; font-weight: 600; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); transition: 0.2s;
        }
        .links-list { width: 100%; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 15; }
        .link-card {
            display: flex; align-items: center; background: #121215; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px; border-radius: 16px; text-decoration: none; color: #ffffff; transition: all 0.25s ease;
        }
        .link-card:hover { background: #1a1a20; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .link-icon-box {
            width: 42px; height: 42px; background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-right: 14px; flex-shrink: 0;
        }
        .link-icon-box svg { width: 22px; height: 22px; fill: currentColor; }
        .link-info { display: flex; flex-direction: column; flex-grow: 1; gap: 2px; }
        .link-title { font-size: 15px; font-weight: 600; }
        .link-desc { font-size: 12px; color: #8a8a8e; }
        .arrow-icon {
            width: 26px; height: 26px; background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #a0a0a5; font-size: 13px; flex-shrink: 0; margin-left: 10px;
        }
        footer { margin-top: 35px; text-align: center; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 15; }
        .footer-brand { font-size: 13px; color: #77777d; font-weight: 500; }
        .footer-soon { font-size: 11px; color: #55555a; }
    </style>
</head>
<body>

    <script>
        // Chat Pop-up umschalten
        function toggleAIChat() {
            const popup = document.getElementById('aiPopupChat');
            popup.classList.toggle('open');
        }

        // Steuerung für das automatische farbliche Leuchten der Dynamic Island
        function setIslandState(active, text) {
            const island = document.getElementById('dynamicIsland');
            const islandText = document.getElementById('islandText');
            if (active) {
                island.classList.add('active');
                islandText.innerText = text;
            } else {
                island.classList.remove('active');
                islandText.innerText = "Tunasys AI";
            }
        }

        // Energie Bälle & Anime Cutscene Skripte
        let ballsActive = false;
        function toggleEnergyBalls() {
            const container = document.getElementById('ball-container');
            ballsActive = !ballsActive;
            container.style.opacity = ballsActive ? '1' : '0';
            if (ballsActive) {
                container.innerHTML = '';
                for (let i = 0; i < 15; i++) {
                    let ball = document.createElement('div');
                    let size = Math.floor(Math.random() * 80) + 30;
                    ball.classList.add('energy-ball');
                    ball.style.width = `${size}px`;
                    ball.style.height = `${size}px`;
                    ball.style.top = `${Math.random() * 100}vh`;
                    ball.style.left = `${Math.random() * 100}vw`;
                    container.appendChild(ball);
                }
            } else {
                container.innerHTML = '';
            }
        }

        let cutsceneActive = false;
        let cutsceneInterval = null;
        function toggleAnimeCutscene() {
            const bg = document.getElementById('anime-bg');
            cutsceneActive = !cutsceneActive;
            bg.style.opacity = cutsceneActive ? '1' : '0';
            if (!cutsceneActive && cutsceneInterval) clearInterval(cutsceneInterval);
        }

        // KI Anfrage abschicken
        function handleKeyPress(event) {
            if (event.key === 'Enter') askAI();
        }

        async function askAI() {
            const inputField = document.getElementById('ai-input');
            const outputDiv = document.getElementById('ai-chat-output');
            const prompt = inputField.value.trim();
            if (!prompt) return;

            outputDiv.innerHTML += `<div><span style="color: #fff; font-weight: 600;">Du:</span> ${prompt}</div>`;
            inputField.value = '';
            outputDiv.scrollTop = outputDiv.scrollHeight;

            // Dynamic Island leuchtet auf (Denkt nach...)
            setIslandState(true, "KI denkt nach...");

            try {
                // AQ-Key mit Authorization Bearer Header für den Browser
                const apiKey = "AQ.Ab8RN6IOphV9_fxtpfNhf-rZaMzwcUJLQ1sp1dx65LftpOhS-Q";
                
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    outputDiv.innerHTML += `<div><span style="color: #00c6ff; font-weight: 600;">KI:</span> ${aiReply}</div>`;
                } else {
                    outputDiv.innerHTML += `<div><span style="color: #ff416c;">Fehler: Ungültige API-Antwort.</span></div>`;
                }
                
                outputDiv.scrollTop = outputDiv.scrollHeight;
            } catch (error) {
                outputDiv.innerHTML += `<div><span style="color: #ff416c;">Verbindungsfehler aufgetreten.</span></div>`;
                outputDiv.scrollTop = outputDiv.scrollHeight;
            } finally {
                // Dynamic Island geht zurück in den Normalzustand
                setIslandState(false);
            }
        }
    </script>

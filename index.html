<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna / Tunasy - Account</title>
    
    <!-- EmailJS SDK laden -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        // Deine Public Key Initialisierung
        (function() {
            emailjs.init("8AklTJr_RMzBEwg7S");
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #000000; color: #ffffff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 16px 40px 16px; overflow-x: hidden; position: relative;
            transition: background 0.6s ease, color 0.6s ease;
        }
        
        /* Light Mode Styles */
        body.light-mode { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 50%, #e2ebf0 100%); color: #111111; }
        body.light-mode::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(173, 216, 230, 0.4) 40%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .logo-wrapper { margin-bottom: 12px; }
        .logo {
            width: 85px; height: 85px; border: 3px solid #ffffff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background-color: #000000; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        body.light-mode .logo {
             background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9);
             color: #111; box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.8), 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 15px; transition: color 0.5s; }
        body.light-mode .title { color: #111; }

        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 25px; z-index: 15; }
        .play-btn {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white; border: none; padding: 9px 16px;
            font-size: 13px; font-weight: 600; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); transition: 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }

        /* --- ACCOUNT FORMULAR STYLES --- */
        #account-section {
            width: 100%; background: #121215; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px; border-radius: 16px; margin-bottom: 25px;
            position: relative; z-index: 15; display: none; /* Standardmäßig versteckt */
        }
        body.light-mode #account-section {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.9), 0 8px 32px rgba(31, 38, 135, 0.1);
        }
        .form-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
        body.light-mode .form-group label { color: #555; }
        .form-group input {
            width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
            color: white; border-radius: 8px; font-size: 13px;
        }
        body.light-mode .form-group input { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); color: #111; }
        
        .form-submit {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white; border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; margin-top: 15px;
        }
        .form-submit:hover { opacity: 0.9; }
        .form-footer { font-size: 11px; text-align: center; margin-top: 10px; color: #888; }
        .form-footer a { color: #00c6ff; text-decoration: none; cursor: pointer; }

        /* Verifikations-Bereich (anfangs versteckt) */
        #verification-area { display: none; text-align: center; }

    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper">
            <div class="logo"><span>T</span></div>
        </div>
        <div class="title">Tuna / Tunasy</div>

        <div class="btn-group">
            <button class="play-btn" style="background: linear-gradient(135deg, #a8ede0, #fed6e3); color: #000;" onclick="toggleLightMode()" id="light-btn">☀️ Light Mode</button>
            <button class="play-btn" style="background: linear-gradient(135deg, #f7ff00, #db36a4);" onclick="toggleAccountForm()" id="account-toggle-btn">👤 Account</button>
        </div>

        <!-- --- ACCOUNT FORMULAR (REGISTER/LOGIN) --- -->
        <div id="account-section">
            
            <!-- Schritt 1: Registrierung / Login -->
            <div id="register-form">
                <h3 class="form-title">Registrieren</h3>
                <div class="form-group">
                    <label>Benutzername</label>
                    <input type="text" id="reg-username" placeholder="TunaFan1">
                </div>
                <div class="form-group">
                    <label>E-Mail</label>
                    <input type="email" id="reg-email" placeholder="tuna@example.com" required>
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <button class="form-submit" onclick="handleRegistration()">Konto erstellen & E-Mail verifizieren</button>
                <div class="form-footer">
                    <span>Hast du schon einen Account? <a onclick="showLoginForm()">Einloggen</a></span>
                </div>
            </div>

            <!-- Schritt 1b: Login Formular (kann später aktiviert werden) -->
            <div id="login-form" style="display: none;">
                <h3 class="form-title">Einloggen</h3>
                <div class="form-group">
                    <label>E-Mail</label>
                    <input type="email" id="login-email" placeholder="tuna@example.com">
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="form-submit">Einloggen</button>
                 <div class="form-footer">
                    <span><a onclick="showForgotPassword()">Passwort vergessen?</a></span><br>
                    <span>Noch keinen Account? <a onclick="showRegisterForm()">Registrieren</a></span>
                </div>
            </div>

            <!-- Schritt 2: E-Mail Verifikation (wird nach Klick auf "Registrieren" sichtbar) -->
            <div id="verification-area">
                <h3 class="form-title" style="color: #fbbf24;">E-Mail Verifikation</h3>
                <p id="v-status" style="font-size: 12px; margin-bottom: 15px;">Wir haben dir einen Code an <br><strong id="v-email-display">...</strong> gesendet.</p>
                <div class="form-group">
                    <label>6-stelligen Code eingeben</label>
                    <input type="text" id="v-code-input" placeholder="123456" maxlength="6" style="text-align: center; font-size: 20px; letter-spacing: 5px;">
                </div>
                <button class="form-submit" style="background: linear-gradient(135deg, #4ade80, #00c853);" onclick="verifyCode()">Code bestätigen</button>
                 <div class="form-footer">
                    <span><a onclick="handleRegistration()">Code erneut senden</a></span>
                </div>
            </div>

        </div>
        <!-- --- ENDE ACCOUNT FORMULAR --- -->

    </div>

    <script>
        let generatedCode = "";
        let pendingUserEmail = "";
        let pendingUsername = "";
        let pendingPassword = "";

        function toggleAccountForm() {
            const section = document.getElementById('account-section');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function showLoginForm() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
             document.getElementById('verification-area').style.display = 'none';
        }
        function showRegisterForm() {
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
             document.getElementById('verification-area').style.display = 'none';
        }

        // --- REGISTRIERUNG & EMAILJS LOGIK ---
        function handleRegistration() {
            const email = document.getElementById('reg-email').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            
            if (!email || !username || !password) {
                alert("Bitte fülle alle Felder aus.");
                return;
            }

            // Daten zwischenspeichern
            pendingUserEmail = email;
            pendingUsername = username;
            pendingPassword = password;

            // Zufälligen 6-stelligen Code generieren
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            // UI umschalten
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('verification-area').style.display = 'block';
            document.getElementById('v-email-display').innerText = email;

            // E-Mail senden via EmailJS
            const templateParams = {
                to_email: email, // WICHTIG: Muss im Template {{to_email}} heißen
                to_name: username,
                code: generatedCode
            };

            emailjs.send("service_12h70yy", "template_idfs248", templateParams)
                .then(function(response) {
                    console.log("SUCCESS", response.status, response.text);
                }, function(error) {
                    console.log("FAILED", error);
                    alert("Fehler beim Senden der E-Mail. Bitte überprüfe die E-Mail-Adresse.");
                    // Fallback: Zurück zum Formular
                    showRegisterForm();
                });
        }

        // --- VERIFIKATIONS-LOGIK ---
        function verifyCode() {
            const enteredCode = document.getElementById('v-code-input').value;
            const status = document.getElementById('v-status');

            if (enteredCode === generatedCode) {
                status.style.color = "#4ade80";
                status.innerHTML = "<strong>Erfolgreich!</strong> Dein Account wurde erstellt und verifiziert.";
                document.getElementById('verification-area').innerHTML = '<div style="padding: 20px; background: rgba(74, 222, 128, 0.1); border-radius: 12px; margin-top: 15px;">🎉 Dein Account ist aktiv! Viel Spaß, ' + pendingUsername + '!</div>';
                
                // Hier könntest du die Daten jetzt im localStorage speichern oder an deinen Server senden
                console.log("Account erstellt:", pendingUsername, pendingUserEmail);

            } else {
                status.style.color = "#f87171";
                status.innerText = "Der Code ist falsch. Bitte versuche es erneut.";
            }
        }

        // --- LIGHT MODE ---
        function toggleLightMode() {
            const body = document.body;
            const btn = document.getElementById('light-btn');
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                btn.style.background = '#000000'; btn.style.color = '#ffffff'; btn.innerText = '🌙 Dark Mode';
            } else {
                btn.style.background = 'linear-gradient(135deg, #a8ede0, #fed6e3)'; btn.style.color = '#000000'; btn.innerText = '☀️ Light Mode';
            }
        }

        // Anime Background & Energy Balls Funktionen (aus vorherigen Versionen)
        function toggleEnergyBalls() {}
        function toggleAnimeCutscene() {}

    </script>
</body>
</html>

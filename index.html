<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna / Tunasy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px 16px;
            overflow-x: hidden;
            position: relative;
            transition: background 0.6s ease, color 0.6s ease;
        }

        /* Light Mode / Flüssiges Glas Design (Weiß & Seifenblasen-Glas) */
        body.light-mode {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 50%, #e2ebf0 100%);
            color: #111111;
        }
        body.light-mode::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(173, 216, 230, 0.4) 40%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Anime-Cutscene Hintergrund-Canvas */
        #anime-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none !important;
            z-index: 1; opacity: 0;
            transition: opacity 1s ease;
        }

        #ball-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none !important;
            z-index: 1; opacity: 0;
            transition: opacity 1s ease;
        }
        .energy-ball {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 195, 255, 0.9) 0%, rgba(0, 110, 255, 0.4) 60%, rgba(0, 50, 200, 0) 100%);
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8);
            animation: floatBall 6s infinite ease-in-out alternate;
            pointer-events: none !important;
        }
        @keyframes floatBall {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            50% { transform: translateY(-40px) translateX(30px) scale(1.1); }
            100% { transform: translateY(30px) translateX(-40px) scale(0.95); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo-wrapper { margin-bottom: 12px; }
        .logo {
            width: 85px; height: 85px;
            border: 3px solid #ffffff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.5s ease;
        }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 15px; transition: color 0.5s; }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            z-index: 15;
        }
        .play-btn {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white; border: none; padding: 9px 16px;
            font-size: 13px; font-weight: 600; border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }

        .links-list { width: 100%; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 15; }
        
        /* Standard Link Card */
        .link-card {
            display: flex; align-items: center;
            background: #121215; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px; border-radius: 16px;
            text-decoration: none; color: #ffffff; transition: all 0.3s ease;
        }
        
        /* Light Mode / Glass Modus für Elemente (Weißer, seifenblasen-artiger Look) */
        body.light-mode .logo {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            color: #111;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.8), 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        body.light-mode .title { color: #111; }
        body.light-mode .link-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            color: #111;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.9), 0 8px 32px rgba(31, 38, 135, 0.1);
            position: relative;
            overflow: hidden;
        }
        /* Seifenblasen-Schimmer Effekt (iridescent reflection) auf den Glas-Buttons */
        body.light-mode .link-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(120deg, transparent 35%, rgba(255, 255, 255, 0.8) 50%, transparent 65%);
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
        }
        body.light-mode .link-card:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 1), 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .link-card:hover { background: #1a1a20; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .link-icon-box {
            width: 42px; height: 42px; background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            margin-right: 14px; flex-shrink: 0;
        }
        body.light-mode .link-icon-box { background: rgba(0, 0, 0, 0.04); }
        .link-icon-box svg { width: 22px; height: 22px; fill: currentColor; }
        .link-info { display: flex; flex-direction: column; flex-grow: 1; gap: 2px; }
        .link-title { font-size: 15px; font-weight: 600; }
        .link-desc { font-size: 12px; color: #8a8a8e; transition: color 0.3s; }
        body.light-mode .link-desc { color: #555555; }

        .arrow-icon {
            width: 26px; height: 26px; background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #a0a0a5; font-size: 13px; flex-shrink: 0; margin-left: 10px;
        }
        body.light-mode .arrow-icon { background: rgba(0, 0, 0, 0.05); color: #333; }

        footer { margin-top: 35px; text-align: center; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 15; }
        .footer-brand { font-size: 13px; color: #77777d; font-weight: 500; }
        body.light-mode .footer-brand { color: #444444; }
        .footer-soon { font-size: 11px; color: #55555a; }

        /* --- DYNAMIC ISLAND (Unten Rechts) --- */
        #dynamic-island {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            background: #000000;
            color: #ffffff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.15);
        }
        #dynamic-island.active {
            opacity: 1;
            pointer-events: auto;
        }
        #dynamic-island.expanded {
            width: 210px;
            height: 44px;
            border-radius: 22px;
            padding: 0 12px;
            justify-content: space-between;
        }
        .di-content {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #dynamic-island.expanded .di-content {
            opacity: 1;
        }
        .di-dot {
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            flex-shrink: 0;
        }
        .di-text {
            font-size: 12px;
            font-weight: 500;
        }
        /* LED Leucht-Modus bei Long Press / Double Tap */
        #dynamic-island.led-glow {
            animation: ledRainbow 1.5s infinite linear;
            border: 2px solid #ffffff;
        }
        @keyframes ledRainbow {
            0% { box-shadow: 0 0 15px #ff0000, inset 0 0 10px #ff0000; }
            33% { box-shadow: 0 0 15px #00ff00, inset 0 0 10px #00ff00; }
            66% { box-shadow: 0 0 15px #0000ff, inset 0 0 10px #0000ff; }
            100% { box-shadow: 0 0 15px #ff0000, inset 0 0 10px #ff0000; }
        }
    </style>
</head>

    <div id="dynamic-island" onclick="handleDIClick()" onmousedown="startLongPress()" onmouseup="endLongPress()" onttouchstart="startLongPress()" ontouchend="endLongPress()">
        <div class="di-content">

            <span class="di-text" id="di-text">Auf TikTok geleitet</span>

    <script>
        let diEnabled = false;

        function toggleDynamicIslandFeature() {
            diEnabled = !diEnabled;
            const diElement = document.getElementById('dynamic-island');
            const toggleBtn = document.getElementById('di-toggle-btn');

            if (diEnabled) {
                diElement.classList.add('active');
                toggleBtn.style.background = 'linear-gradient(135deg, #00b09b, #96c93d)';
                toggleBtn.innerText = '🏝️ Dynamic Island: ON';
            } else {
                diElement.classList.remove('active', 'expanded', 'led-glow');
                toggleBtn.style.background = 'linear-gradient(135deg, #434343, #000000)';
                toggleBtn.innerText = '🏝️ Dynamic Island: OFF';
            }
        }

        function triggerDynamicIsland(platform) {
            if (!diEnabled) return;
            const di = document.getElementById('dynamic-island');
            const text = document.getElementById('di-text');
            
            text.innerText = `Auf ${platform} geleitet`;
            di.classList.add('expanded');

            setTimeout(() => {
                di.classList.remove('expanded');
            }, 3000);
        }

        /* Double Tap & Long Press Erkennung für LED-Modus */
        let lastTap = 0;
        let pressTimer = null;

        function handleDIClick() {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            
            // Double Tap Erkennung (< 300ms)
            if (tapLength < 300 && tapLength > 0) {
                toggleLEDMode();
            }
            lastTap = currentTime;
        }

        function startLongPress() {
            pressTimer = setTimeout(() => {
                toggleLEDMode();
            }, 600); // Nach 0.6 Sekunden halten startet das LED-Leuchten
        }

        function endLongPress() {
            clearTimeout(pressTimer);
        }

        function toggleLEDMode() {
            const di = document.getElementById('dynamic-island');
            di.classList.toggle('led-glow');
            if (!di.classList.contains('expanded')) {
                di.classList.add('expanded');
                document.getElementById('di-text').innerText = 'LED Modus Aktiv!';
                setTimeout(() => {
                    di.classList.remove('expanded');
                }, 2500);
            }
        }

        function toggleLightMode() {
            const body = document.body;
            const btn = document.getElementById('light-btn');
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                btn.style.background = '#000000';
                btn.style.color = '#ffffff';
                btn.innerText = '🌙 Dark Mode';
            } else {
                btn.style.background = 'linear-gradient(135deg, #a8ede0, #fed6e3)';
                btn.style.color = '#000000';
                btn.innerText = '☀️ Light Mode';
            }
        }

        let ballsActive = false;
        function toggleEnergyBalls() {
            const container = document.getElementById('ball-container');
            ballsActive = !ballsActive;
            if (ballsActive) {
                container.style.opacity = '1';
                createEnergyBalls();
            } else {
                container.style.opacity = '0';
                container.innerHTML = '';
            }
        }
        function createEnergyBalls() {
            const container = document.getElementById('ball-container');
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                let ball = document.createElement('div');
                let size = Math.floor(Math.random() * 80) + 30;
                ball.classList.add('energy-ball');
                ball.style.width = `${size}px`;
                ball.style.height = `${size}px`;
                ball.style.top = `${Math.random() * 100}vh`;
                ball.style.left = `${Math.random() * 100}vw`;
                ball.style.animationDuration = `${Math.random() * 5 + 4}s`;
                ball.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(ball);
            }
        }

        let cutsceneActive = false;
        let cutsceneInterval = null;

        function toggleAnimeCutscene() {
            const bg = document.getElementById('anime-bg');
            cutsceneActive = !cutsceneActive;
            if (cutsceneActive) {
                bg.style.opacity = '1';
                startAnimeCutscene();
            } else {
                bg.style.opacity = '0';
                if (cutsceneInterval) clearInterval(cutsceneInterval);
            }
        }

        function startAnimeCutscene() {
            const canvas = document.getElementById('anime-bg');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let step = 0;
            let explosions = [];

            function drawAnimeEye(x, y, scale, type) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.shadowBlur = 30;
                ctx.shadowColor = type === 'red' ? '#ff0000' : '#8a2be2';

                ctx.beginPath();
                ctx.moveTo(-50, 0);
                ctx.quadraticCurveTo(0, -32, 50, 0);
                ctx.quadraticCurveTo(0, 32, -50, 0);
                ctx.fillStyle = type === 'red' ? 'rgba(180, 0, 0, 0.4)' : 'rgba(75, 0, 130, 0.4)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.stroke();

                if (type === 'red') {
                    for (let i = 0; i < 3; i++) {
                        let angle = (step * 0.04) + (i * ((Math.PI * 2) / 3));
                        let tx = Math.cos(angle) * 11;
                        let ty = Math.sin(angle) * 11;
                        ctx.beginPath();
                        ctx.arc(tx, ty, 3.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#000000';
                        ctx.fill();
                    }
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, 13, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.restore();
            }

            function drawAnimeCharacter(x, y, facingRight, color, pose) {
                ctx.save();
                ctx.translate(x, y);
                if (!facingRight) ctx.scale(-1, 1);

                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 3.5;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;

                ctx.beginPath();
                ctx.moveTo(-12, -35);
                ctx.lineTo(-20, -55);
                ctx.lineTo(-5, -45);
                ctx.lineTo(5, -60);
                ctx.lineTo(15, -45);
                ctx.lineTo(22, -50);
                ctx.lineTo(12, -32);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, -30, 11, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -19);
                ctx.lineTo(-12, 10);
                ctx.lineTo(12, 10);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                if (pose === 'punch') {
                    ctx.moveTo(0, -15);
                    ctx.lineTo(35, -20);
                    ctx.moveTo(0, -15);
                    ctx.lineTo(-15, 5);
                } else if (pose === 'charge') {
                    ctx.moveTo(0, -15);
                    ctx.lineTo(-20, -30);
                    ctx.moveTo(0, -15);
                    ctx.lineTo(20, -30);
                } else {
                    ctx.moveTo(0, -15);
                    ctx.lineTo(-18, 0);
                    ctx.moveTo(0, -15);
                    ctx.lineTo(18, 0);
                }
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-8, 10);
                ctx.lineTo(-15, 45);
                ctx.moveTo(8, 10);
                ctx.lineTo(15, 45);
                ctx.stroke();
                ctx.restore();
            }

            function addExplosion(x, y, color) {
                explosions.push({ x: x, y: y, radius: 10, maxRadius: 80, alpha: 1, color: color });
            }

            if (cutsceneInterval) clearInterval(cutsceneInterval);

            cutsceneInterval = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                step++;

                let cx = canvas.width / 2;
                let cy = canvas.height / 3;

                let eyePulse = 1 + Math.sin(step * 0.08) * 0.06;
                drawAnimeEye(cx, cy - 70, eyePulse, step % 180 < 90 ? 'red' : 'purple');

                let phase = step % 160;
                let char1X, char2X, pose1 = 'normal', pose2 = 'normal';

                if (phase < 50) {
                    char1X = cx - 120 + phase * 2;
                    char2X = cx + 120 - phase * 2;
                    pose1 = 'charge';
                    pose2 = 'charge';
                } else if (phase >= 50 && phase < 90) {
                    char1X = cx - 20 + Math.sin(step * 0.5) * 10;
                    char2X = cx + 20 + Math.cos(step * 0.5) * 10;
                    pose1 = 'punch';
                    pose2 = 'punch';
                    if (phase === 52) addExplosion(cx, cy + 100, '#00ffff');
                    if (phase === 72) addExplosion(cx, cy + 100, '#ff0055');
                } else {
                    let d = (phase - 90);
                    char1X = cx - 40 - d * 2;
                    char2X = cx + 40 + d * 2;
                }

                let charY = cy + 100;
                drawAnimeCharacter(char1X, charY, true, '#00e5ff', pose1);
                drawAnimeCharacter(char2X, charY, false, '#ff2a6d', pose2);

                for (let i = explosions.length - 1; i >= 0; i--) {
                    let ex = explosions[i];
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                    ctx.fillStyle = ex.color;
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = ex.color;
                    ctx.globalAlpha = ex.alpha;
                    ctx.fill();
                    ctx.restore();

                    ex.radius += 10;
                    ex.alpha -= 0.07;
                    if (ex.alpha <= 0) explosions.splice(i, 1);
                }

                for (let i = 0; i < 4; i++) {
                    let px = cx + (Math.random() - 0.5) * 350;
                    let py = cy + 70 + (Math.random() - 0.5) * 120;
                    ctx.fillStyle = Math.random() > 0.5 ? '#00ffff' : '#ff0055';
                    ctx.fillRect(px, py, 2.5, 2.5);
                }
            }, 1000 / 30);
        }
    </script>

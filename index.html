    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #08040c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px 16px;
            overflow-x: hidden;
            position: relative;
            transition: background 0.6s ease, color 0.6s ease;
        }

        body.light-mode {
            background: linear-gradient(135deg, #2c1638 0%, #1a0b2e 50%, #08040c 100%);
            color: #ffffff;
        }

        #ball-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none !important;
            z-index: 1; opacity: 0;
            transition: opacity 1s ease;
        }
        .energy-ball {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.9) 0%, rgba(194, 65, 12, 0.4) 60%, rgba(0, 0, 0, 0) 100%);
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8);
            animation: floatBall 6s infinite ease-in-out alternate;
            pointer-events: none !important;
        }
        @keyframes floatBall {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            50% { transform: translateY(-40px) translateX(30px) scale(1.1); }
            100% { transform: translateY(30px) translateX(-40px) scale(0.95); }
        }

        /* --- HALLOWEEN ELEMENTE (Geister & Zauber) --- */
        #halloween-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none !important;
            z-index: 1; overflow: hidden;
        }

        .ghost {
            position: absolute;
            font-size: 35px;
            opacity: 0.25;
            animation: floatGhost 8s infinite ease-in-out alternate;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
        }
        @keyframes floatGhost {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            50% { transform: translateY(-60px) translateX(40px) scale(1.1); }
            100% { transform: translateY(40px) translateX(-30px) scale(0.9); }
        }

        .witch-magic {
            position: absolute;
            font-size: 28px;
            opacity: 0.3;
            animation: witchSparkle 5s infinite linear;
        }
        @keyframes witchSparkle {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.5; }
            100% { transform: scale(0.8) rotate(360deg); opacity: 0.1; }
        }

        /* --- GROSSE KÜRBISSE AN DEN SEITEN --- */
        .side-pumpkin {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 90px;
            height: 90px;
            background-image: url('https://emojicdn.elk.sh/🎃');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5;
            filter: drop-shadow(0 0 25px rgba(249, 115, 22, 0.9));
            animation: pumpkinGlow 3s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .pumpkin-left { left: 20px; }
        .pumpkin-right { right: 20px; }

        @keyframes pumpkinGlow {
            0% { transform: translateY(-50%) scale(1) rotate(-5deg); filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.6)); }
            100% { transform: translateY(-50%) scale(1.1) rotate(5deg); filter: drop-shadow(0 0 30px rgba(249, 115, 22, 1)); }
        }

        @media(max-width: 768px) {
            .side-pumpkin { width: 55px; height: 55px; }
            .pumpkin-left { left: 8px; }
            .pumpkin-right { right: 8px; }
        }

        /* --- RAUCH VON UNTEN --- */
        #bottom-smoke {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 180px;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }
        .smoke-bottom-puff {
            position: absolute;
            bottom: -40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            filter: blur(25px);
            animation: riseBottomSmoke 6s infinite ease-in-out;
        }
        @keyframes riseBottomSmoke {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-120px) scale(1.8); opacity: 0; }
        }

        /* --- LOGO RAUCH HINTER DEM T --- */
        .logo-wrapper { margin-bottom: 12px; position: relative; }
        .logo-smoke {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background: rgba(249, 115, 22, 0.35);
            border-radius: 50%;
            filter: blur(14px);
            z-index: 1;
            animation: logoSmokeGlow 3s infinite alternate ease-in-out;
        }
        @keyframes logoSmokeGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.7; }
        }

        /* --- SÜSSIGKEITEN VON UNTEN --- */
        .candy {
            position: fixed;
            bottom: -50px;
            font-size: 28px;
            z-index: 3;
            animation: candyRiseUp 6s linear forwards;
            pointer-events: none;
        }
        @keyframes candyRiseUp {
            0% { bottom: -50px; transform: scale(0.3) rotate(0deg); opacity: 0; }
            15% { transform: scale(1.4) rotate(45deg); opacity: 1; }
            85% { opacity: 1; }
            100% { bottom: 105vh; transform: scale(1) rotate(360deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo {
            position: relative;

            border: 3px solid #f97316; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;

        .btn-group {

        .play-btn:active { transform: scale(0.95); }

        .links-list { width: 100%; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 15; }
        
        .link-card {
            display: flex; align-items: center;

            padding: 14px 18px; border-radius: 16px;

        .link-info { display: flex; flex-direction: column; flex-grow: 1; gap: 2px; }
        .link-title { font-size: 15px; font-weight: 600; }
        .link-desc { font-size: 12px; color: #b1a7bd; }

        .arrow-icon {
            width: 26px; height: 26px; background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #f97316; font-size: 13px; flex-shrink: 0; margin-left: 10px;
        }

        footer { margin-top: 35px; text-align: center; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 15; }
        .footer-brand { font-size: 13px; color: #f97316; font-weight: 500; }
        .footer-soon { font-size: 11px; color: #8a7c98; }

        /* --- DYNAMIC ISLAND --- */
        #dynamic-island {
            position: fixed; bottom: 20px; right: 20px; width: 38px; height: 38px;
            background: #12081c; color: #ffffff; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(249,115,22,0.3); z-index: 9999; cursor: pointer;
            overflow: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; pointer-events: none; border: 1px solid rgba(249,115,22,0.4);
        }
        #dynamic-island.active { opacity: 1; pointer-events: auto; }
        #dynamic-island.expanded { width: 280px; height: 52px; border-radius: 26px; padding: 0 14px; justify-content: space-between; }
        .di-content { display: flex; align-items: center; gap: 10px; width: 100%; opacity: 0; transition: opacity 0.2s ease; }
        #dynamic-island.expanded .di-content { opacity: 1; }
        .di-dot { width: 9px; height: 9px; background: #f97316; border-radius: 50%; box-shadow: 0 0 10px #f97316; flex-shrink: 0; }
        .di-mic { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
        .di-text { font-size: 12px; font-weight: 500; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* --- ACCOUNT MODAL --- */
        #account-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .account-box {
            background: #12081c; border: 1px solid rgba(249, 115, 22, 0.4);
            width: 100%; max-width: 380px; border-radius: 24px; padding: 24px;
            display: flex; flex-direction: column; gap: 15px; position: relative; color: white;

        }
        .account-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer; }
        .account-title { font-size: 18px; font-weight: 700; text-align: center; color: #f97316; }
        .account-input {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(249, 115, 22, 0.3); border-radius: 12px; color: white; font-size: 14px; outline: none; text-align: center;
        }
        .account-submit {
            background: linear-gradient(135deg, #c2410c, #f97316); color: white;
            border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .account-submit:hover { opacity: 0.9; }
    </style>
</head>

    <script>
        let diEnabled = false;

        // --- SÜSSIGKEITEN VON UNTEN ---
        const candies = ["🍬", "🍫", "🍭", "🎃", "👻"];
        function spawnCandy() {
            const container = document.getElementById('candy-container');
            if (!container) return;

            const candy = document.createElement('div');
            candy.classList.add('candy');
            candy.innerText = candies[Math.floor(Math.random() * candies.length)];
            candy.style.left = Math.random() * 90 + 5 + 'vw';
            candy.style.animationDuration = (Math.random() * 3 + 4) + 's';

            container.appendChild(candy);
            setTimeout(() => { candy.remove(); }, 7000);
        }
        setInterval(spawnCandy, 1200);

        // --- ACCOUNT MODAL STEUERUNG ---
        function openAccountModal() { document.getElementById('account-modal').style.display = 'flex'; }
        function closeAccountModal() { document.getElementById('account-modal').style.display = 'none'; }
        function closeAccountModalOutside(event) { if (event.target.id === 'account-modal') closeAccountModal(); }

        // --- EMAILJS VERIFIZIERUNG ---
        function sendVerificationEmail() {
            const username = document.getElementById('acc-username').value;
            const email = document.getElementById('acc-email').value;
            const msgBox = document.getElementById('account-status-msg');

            if (!username || !email) {
                msgBox.style.color = "#f87171";
                msgBox.innerText = "Bitte fülle alle Felder aus!";
                return;
            }

            msgBox.style.color = "#fbbf24";
            msgBox.innerText = "Sende Benachrichtigung...";

            const templateParams = {
                to_name: username,
                to_email: email,
                user_email: email,
                message: "Halloween Verifizierung angefordert von: " + username + " (" + email + ")"
            };

            emailjs.send("service_12h70yy", "template_oxdtx19", templateParams)
                .then(function() {
                    msgBox.style.color = "#4ade80";
                    msgBox.innerText = "Erfolgreich gesendet! 🎃";
                    document.getElementById('welcome-title').innerText = "Willkommen, " + username + "! 🦇";
                    document.getElementById('account-btn').innerText = "✅ " + username;
                    setTimeout(closeAccountModal, 2000);
                }, function(error) {
                    msgBox.style.color = "#f87171";
                    msgBox.innerText = "Fehler beim Senden.";
                    console.error(error);
                });
        }

        // --- DYNAMIC ISLAND & SPRACHBEFEHLE ---
        function toggleDynamicIslandFeature() {
            diEnabled = !diEnabled;
            const diElement = document.getElementById('dynamic-island');
            const toggleBtn = document.getElementById('di-toggle-btn');
            if (diEnabled) {
                diElement.classList.add('active');
                toggleBtn.style.background = 'linear-gradient(135deg, #c2410c, #f97316)';
                toggleBtn.innerText = '🏝️ Dynamic Island: ON';
            } else {
                diElement.classList.remove('active', 'expanded');
                toggleBtn.style.background = 'linear-gradient(135deg, #434343, #000000)';
                toggleBtn.innerText = '🏝️ Dynamic Island: OFF';
            }
        }

        function startVoiceAssistant(event) {
            event.stopPropagation();
            const text = document.getElementById('di-text');
            const di = document.getElementById('dynamic-island');
            di.classList.add('expanded');
            text.innerText = "Sag: YouTube, TikTok, Discord oder Shop...";

            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'de-DE';
                recognition.start();

                recognition.onresult = function(event) {
                    let speechResult = event.results[0][0].transcript.toLowerCase();
                    setTimeout(() => {
                        if (speechResult.includes('youtube')) { window.open(document.getElementById('link-youtube').href, '_blank'); }
                        else if (speechResult.includes('tiktok')) { window.open(document.getElementById('link-tiktok').href, '_blank'); }
                        else if (speechResult.includes('discord')) { window.open(document.getElementById('link-discord').href, '_blank'); }
                        else if (speechResult.includes('shop')) { window.open(document.getElementById('link-shop').href, '_blank'); }
                    }, 800);
                };
            }
        }

        function triggerDynamicIsland(platform) {
            if (!diEnabled) return;
            const di = document.getElementById('dynamic-island');
            const text = document.getElementById('di-text');
            text.innerText = `Zu ${platform} weitergeleitet`;
            di.classList.add('expanded');
            setTimeout(() => { di.classList.remove('expanded'); }, 2500);
        }

        function handleDIClick() {
            const di = document.getElementById('dynamic-island');
            di.classList.toggle('expanded');
            document.getElementById('di-text').innerText = 'Halloween Modus Aktiv! 🎃';
        }

        function toggleLightMode() {
            const body = document.body;
            const btn = document.getElementById('light-btn');
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                btn.style.background = '#000000'; btn.style.color = '#ffffff'; btn.innerText = '🌙 Dark Mode';
            } else {
                btn.style.background = 'linear-gradient(135deg, #a8ede0, #fed6e3)'; btn.style.color = '#000000'; btn.innerText = '☀️ Light Mode';
            }
        }

        let ballsActive = false;
        function toggleEnergyBalls() {
            const container = document.getElementById('ball-container');
            ballsActive = !ballsActive;
            if (ballsActive) { container.style.opacity = '1'; createEnergyBalls(); }
            else { container.style.opacity = '0'; container.innerHTML = ''; }
        }
        function createEnergyBalls() {
            const container = document.getElementById('ball-container');
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                let ball = document.createElement('div');
                let size = Math.floor(Math.random() * 80) + 30;
                ball.classList.add('energy-ball');
                ball.style.width = `${size}px`; ball.style.height = `${size}px`;
                ball.style.top = `${Math.random() * 100}vh`; ball.style.left = `${Math.random() * 100}vw`;
                ball.style.animationDuration = `${Math.random() * 5 + 4}s`; ball.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(ball);
            }
        }
    </script>
</body>
</html>

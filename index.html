        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px 16px;
            overflow-x: hidden;
            position: relative;
        }

        #ball-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none !important;
            z-index: 1; opacity: 0;
            transition: opacity 1s ease;
        }
        .energy-ball {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 195, 255, 0.9) 0%, rgba(0, 110, 255, 0.4) 60%, rgba(0, 50, 200, 0) 100%);
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8);
            animation: floatBall 6s infinite ease-in-out alternate;
            pointer-events: none !important;
        }
        @keyframes floatBall {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            50% { transform: translateY(-40px) translateX(30px) scale(1.1); }
            100% { transform: translateY(30px) translateX(-40px) scale(0.95); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo-wrapper { margin-bottom: 12px; }
        .logo {
            width: 85px; height: 85px;
            border: 3px solid #ffffff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .logo span { color: #ffffff; font-size: 42px; font-weight: bold; line-height: 1; margin-top: -2px; }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 15px; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            z-index: 15;
        }
        .play-btn {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white; border: none; padding: 10px 20px;
            font-size: 14px; font-weight: 600; border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }

        /* Kampf-Arena Overlay */
        #fight-arena {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #fight-canvas {
            background: #0a0a12;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 114, 255, 0.3);
            max-width: 95vw;
            max-height: 60vh;
        }
        .fight-close {
            margin-top: 20px;
            background: #ff3b30;
            color: white; border: none;
            padding: 10px 25px; border-radius: 20px;
            font-weight: bold; cursor: pointer;
        }

        .links-list { width: 100%; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 15; }
        .link-card {
            display: flex; align-items: center;
            background: #121215; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px; border-radius: 16px;
            text-decoration: none; color: #ffffff; transition: all 0.25s ease;
        }
        .link-card:hover { background: #1a1a20; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .link-icon-box {
            width: 42px; height: 42px; background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            margin-right: 14px; flex-shrink: 0;
        }
        .link-icon-box svg { width: 22px; height: 22px; fill: currentColor; }
        .link-info { display: flex; flex-direction: column; flex-grow: 1; gap: 2px; }
        .link-title { font-size: 15px; font-weight: 600; }
        .link-desc { font-size: 12px; color: #8a8a8e; }
        .arrow-icon {
            width: 26px; height: 26px; background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #a0a0a5; font-size: 13px; flex-shrink: 0; margin-left: 10px;
        }
        footer { margin-top: 35px; text-align: center; display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 15; }
        .footer-brand { font-size: 13px; color: #77777d; font-weight: 500; }
        .footer-soon { font-size: 11px; color: #55555a; }
    </style>

    <script>
        let ballsActive = false;
        function toggleEnergyBalls() {
            const container = document.getElementById('ball-container');
            ballsActive = !ballsActive;
            if (ballsActive) {
                container.style.opacity = '1';
                createEnergyBalls();
            } else {
                container.style.opacity = '0';
                container.innerHTML = '';
            }
        }
        function createEnergyBalls() {
            const container = document.getElementById('ball-container');
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const ball = document.createElement('div');
                const size = Math.floor(Math.random() * 80) + 30;
                ball.classList.add('energy-ball');
                ball.style.width = `${size}px`;
                ball.style.height = `${size}px`;
                ball.style.top = `${Math.random() * 100}vh`;
                ball.style.left = `${Math.random() * 100}vw`;
                ball.style.animationDuration = `${Math.random() * 5 + 4}s`;
                ball.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(ball);
            }
        }

        // --- STICKMAN FIGHT SCRIPT ---
        let fightInterval = null;
        function startFight() {
            document.getElementById('fight-arena').style.display = 'flex';
            const canvas = document.getElementById('fight-canvas');
            const ctx = canvas.getContext('2d');

            let frame = 0;
            let explosions = [];

            function drawStickman(x, y, color, facingRight, action) {
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                
                // Kopf
                ctx.arc(x, y - 30, 10, 0, Math.PI * 2);
                // Körper
                ctx.moveTo(x, y - 20);
                ctx.lineTo(x, y + 10);
                
                let handOffset = facingRight ? 15 : -15;
                if (action === 'punch') {
                    // Schlag-Animation
                    ctx.moveTo(x, y - 10);
                    ctx.lineTo(x + handOffset * 2, y - 15);
                } else if (action === 'kick') {
                    ctx.moveTo(x, y - 10);
                    ctx.lineTo(x + handOffset, y);
                } else {
                    // Normal
                    ctx.moveTo(x, y - 10);
                    ctx.lineTo(x + handOffset, y);
                    ctx.moveTo(x, y - 10);
                    ctx.lineTo(x - handOffset, y);
                }

                // Beine
                ctx.moveTo(x, y + 10);
                ctx.lineTo(x - 10, y + 35);
                ctx.moveTo(x, y + 10);
                ctx.lineTo(x + 10, y + 35);

                ctx.stroke();
            }

            function addExplosion(x, y) {
                explosions.push({ x: x, y: y, radius: 5, alpha: 1 });
            }

            if(fightInterval) clearInterval(fightInterval);

            fightInterval = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frame++;

                // Boden zeichnen
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 280);
                ctx.lineTo(600, 280);
                ctx.stroke();

                // Kampf-Logik Schleife (ca. alle 4 Sekunden ein kompletter Kampf-Zyklus)
                let loopFrame = frame % 240;
                let p1X = 150;
                let p2X = 450;
                let p1Action = 'idle';
                let p2Action = 'idle';
                let p1Color = '#00c6ff';
                let p2Color = '#ff416c';

                if (loopFrame > 60 && loopFrame < 100) {
                    // P1 läuft vor & schlägt
                    p1X = 150 + (loopFrame - 60) * 3;
                    p1Action = 'punch';
                    if(loopFrame === 85) addExplosion(p1X + 20, 245);
                } else if (loopFrame >= 100 && loopFrame < 140) {
                    // P1 weicht zurück, P2 kontert mit Kick
                    p1X = 270 - (loopFrame - 100) * 2;
                    p2X = 450 - (loopFrame - 100) * 3;
                    p2Action = 'kick';
                    if(loopFrame === 120) addExplosion(p2X - 20, 245);
                } else if (loopFrame >= 140 && loopFrame < 190) {
                    // Beide feuern Energie-Kugeln aufeinander
                    p1X = 190;
                    p2X = 370;
                    if(loopFrame === 150) addExplosion(280, 245);
                } else if (loopFrame >= 190) {
                    // Epischer Rückzug
                    p1X = 190 - (loopFrame - 190);
                    p2X = 370 + (loopFrame - 190);
                }

                // Explosionen rendern
                for (let i = explosions.length - 1; i >= 0; i--) {
                    let ex = explosions[i];
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 165, 0, ${ex.alpha})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(255, 69, 0, ${ex.alpha})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();

                    ex.radius += 2;
                    ex.alpha -= 0.05;
                    if (ex.alpha <= 0) explosions.splice(i, 1);
                }

                // Stickmen zeichnen
                drawStickman(p1X, 250, p1Color, true, p1Action);
                drawStickman(p2X, 250, p2Color, false, p2Action);

            }, 1000 / 30);
        }

        function closeFight() {
            document.getElementById('fight-arena').style.display = 'none';
            if(fightInterval) clearInterval(fightInterval);
        }
    </script>

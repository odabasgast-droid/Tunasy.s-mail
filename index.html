<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunasy.s Mail</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 70px;
      background: #111;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 15px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border: 3px solid white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      position: relative;
    }

    .logo span {
      position: absolute;
      font-size: 16px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    aside {
      width: 230px;
      background: #101010;
      border-right: 1px solid #292929;
      padding: 20px 12px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
    }

    .compose {
      width: 100%;
      background: white;
      color: black;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .menu {
      width: 100%;
      text-align: left;
      background: transparent;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .menu:hover,
    .menu.active {
      background: #242424;
    }

    main {
      flex: 1;
      padding: 25px;
    }

    .welcome {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 25px;
      max-width: 800px;
    }

    .welcome h1 {
      margin-bottom: 10px;
    }

    .welcome p {
      color: #aaa;
      line-height: 1.5;
    }

    .mailbox {
      margin-top: 25px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      overflow: hidden;
      max-width: 900px;
    }

    .mail {
      padding: 18px;
      border-bottom: 1px solid #292929;
    }

    .mail:last-child {
      border-bottom: 0;
    }

    .mail strong {
      display: block;
      margin-bottom: 5px;
    }

    .mail span {
      color: #999;
    }

    @media (max-width: 650px) {
      aside {
        width: 75px;
      }

      .menu {
        text-align: center;
        font-size: 0;
      }

      .menu::first-letter {
        font-size: 20px;
      }

      .compose {
        font-size: 0;
      }

      .compose::after {
        content: "✏️";
        font-size: 20px;
      }

      main {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo"><span>T</span></div>
  <div class="name">Tunasy.s Mail</div>
</header>

<div class="layout">

  <aside>
    <button class="compose">✏️ E-Mail schreiben</button>

    <button class="menu active">📥 Posteingang</button>
    <button class="menu">⭐ Markiert</button>
    <button class="menu">📤 Gesendet</button>
    <button class="menu">📝 Entwürfe</button>
    <button class="menu">🗑️ Papierkorb</button>
    <button class="menu">⚙️ Einstellungen</button>
  </aside>

  <main>

    <div class="welcome">
      <h1>Willkommen bei Tunasy.s 👋</h1>
      <p>
        Deine moderne E-Mail-App mit deiner eigenen
        <b>@tunasys.de</b>-Adresse.
      </p>
    </div>

    <div class="mailbox">

      <div class="mail">
        <strong>Tunasy.s</strong>
        <span>Willkommen bei deiner neuen Mail-App.</span>
      </div>

      <div class="mail">
        <strong>Dein Posteingang</strong>
        <span>Hier werden später deine echten E-Mails angezeigt.</span>
      </div>

    </div>

  </main>

</div>

</body>
</html>
